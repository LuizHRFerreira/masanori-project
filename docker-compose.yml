services:
  mongodb:
    image: mongo:8.2
    container_name: masanori-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: masanori-backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8001
    environment:
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB_NAME: masanori
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:5174
    ports:
      - "8001:8001"
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: masanori-frontend
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_PROXY_TARGET: http://backend:8001
    ports:
      - "5174:5173"
    depends_on:
      - backend

volumes:
  mongodb_data:
